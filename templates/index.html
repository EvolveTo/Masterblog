<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1 class="text-gradient">Welcome to My Flask Blog!</h1>
    <a href="{{ url_for('add') }}" class="text-gradient">+ New Post</a>
    {% for post in posts %}
    <div class="post">
        <div class="row">
            <h2>{{ post['title'] }}</h2>

            {% if not post.likes %}
                <form action="{{ url_for('likes', post_id=post.id) }}" method="POST">
                    <a><button type="submit">❤</button></a>
                </form>
            {% else %}
                <form action="{{ url_for('likes', post_id=post.id) }}" method="POST">
                    <a><button type="submit">{{ post.likes }} ❤️</button></a>
                </form>
            {% endif %}
        </div>
        <p><em>Written by {{ post['author'] }}</em></p>
        <p>{{ post['content'] }}</p>
        <div class="row">
            <a href="{{ url_for('update', post_id=post.id) }}"><button type="button">Bearbeiten</button></a>

            <form action="{{ url_for('delete_post', post_id=post.id) }}" method="POST">
                <input type="submit" value="Delete">
            </form>
        </div>
    </div>
    {% endfor %}
</body>
</html>


{% if errors %}
            <div style="color: red;">
                {% for error in errors %}
                    {{ error }}<br>
                {% endfor %}
            </div>
        {% endif %}
