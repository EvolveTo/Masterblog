<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Blogpost</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1 class="text-gradient">Edit Blog Post</h1>
    <form action="{{ url_for('update', post_id=post['id']) }}" method="POST">
        <label for="author">Author:</label>
        <input type="text" id="author" name="author" value="{{ post.author }}" required><br><br>
        <label for="title">Title:</label>

        <input type="text" id="title" name="title" value="{{ post.title }}" required><br><br>
        <label for="content">Text:</label>
        <input type="text" id="content" name="content" value="{{ post.content }}" required><br><br>
        <div class="row">
            <a href="/"><button type="button">&lt; Posts</button></a>

            {% if not post.likes: %}
                <input type="submit" value="Update">
            {% else %}
                <button type="submit">
                    Update<br>
                    {{ post.likes }} ❤️<br>
                    get lost
                </button>
            {% endif %}
        </div>

        {% if errors %}
            <div style="color: red;">
                {% for error in errors %}
                    {{ error }}<br>
                {% endfor %}
            </div>
        {% endif %}
    </form>
</body>
</html>
